[package]
authors = ["Willem Vanhulle <willemvanhulle@protonmail.com>", "Trevor Murphy <trevor.m.murphy@gmail.com>"]
categories = ["parsing", "text-editors"]
description = "Tree-sitter grammar for Lean 4 (generates parser at build time)"
edition = "2021"
keywords = ["tree-sitter", "parser", "lean", "lean4"]
license = "MIT"
name = "tree-sitter-lean4"
repository = "https://github.com/tmurph/tree-sitter-lean"
version = "0.4.0"

build = "build.rs"
include = ["build.rs", "src/*", "grammar.js", "grammar/*", "tree-sitter.json"]

[dependencies]
tree-sitter = "0.25"

[build-dependencies]
cc = "1.0"
