name: CI

on:
  push:
    branches: [main, devel]
  pull_request:
  workflow_dispatch:

jobs:
  grammar:
    name: Generate, build and test the grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The npm package is a thin downloader: its install script fetches the
      # prebuilt binary from tree-sitter's GitHub releases. Using it rather
      # than curling that asset directly, because it is how the CLI is
      # normally installed and so reads as familiar; it also tracks upstream
      # if the release asset is ever renamed.
      #
      # Not `cargo install` — that compiled the CLI and its dependency tree
      # from source and dominated this job's runtime. Not the distro package
      # either: ubuntu-latest ships tree-sitter-cli 0.20.8, which predates the
      # --lib-path/--lang-name flags and the :skip corpus attribute used here.
      - name: Install tree-sitter CLI
        env:
          TS_VERSION: 0.26.9
        run: |
          npm install -g --allow-scripts tree-sitter-cli "tree-sitter-cli@${TS_VERSION}"
          # --allow-scripts is required: npm 12 blocks install-time lifecycle
          # scripts by default, and this package's binary IS its install
          # script. Without it npm cheerfully installs a shim with nothing
          # behind it and the first `tree-sitter` call dies with ENOENT.
          # Scoped to the one package rather than
          # --dangerously-allow-all-scripts.
          #
          # Assert the version explicitly. Without this, a mismatch — or a
          # silently script-blocked install — would first surface as the
          # staleness check below failing with "src/parser.c is stale", which
          # is true but misleading about the cause.
          installed="$(tree-sitter --version | awk '{print $2}')"
          echo "installed: $installed (pinned: $TS_VERSION)"
          [ "$installed" = "$TS_VERSION" ] || { echo "::error::tree-sitter CLI is $installed, expected $TS_VERSION"; exit 1; }

      # Generation is memory-hungry on this grammar (~3.7 GiB peak locally).
      # Cap it so a runaway allocation fails the job instead of the runner —
      # this has OOM-killed a developer machine before. Raise deliberately,
      # not reflexively, if generation legitimately grows.
      - name: Generate parser
        run: (ulimit -v 5242880 && tree-sitter generate)

      # src/parser.c is committed. If generation produces something different,
      # the committed artifact is stale — but note that tree-sitter's output is
      # not byte-reproducible run to run, so compare the state counts rather
      # than the file.
      - name: Check committed parser is not stale
        run: |
          for sym in STATE_COUNT LARGE_STATE_COUNT SYMBOL_COUNT FIELD_COUNT PRODUCTION_ID_COUNT; do
            committed=$(git show HEAD:src/parser.c | grep -m1 "^#define $sym " | awk '{print $3}')
            current=$(grep -m1 "^#define $sym " src/parser.c | awk '{print $3}')
            echo "$sym: committed=$committed current=$current"
            if [ "$committed" != "$current" ]; then
              echo "::error::$sym differs — src/parser.c is stale, regenerate and commit it"
              exit 1
            fi
          done

      - name: Build shared library
        run: cc -O2 -fPIC -shared -I src src/parser.c src/scanner.c -o "$PWD/libtree-sitter-lean.so"

      # Point the test runner at the library we just built. tree-sitter's own
      # cache at ~/.cache/tree-sitter/lib/<name>.so is keyed by grammar name
      # only, and relying on it has produced false passes.
      - name: Run corpus tests
        run: tree-sitter test --lib-path "$PWD/libtree-sitter-lean.so" --lang-name lean
